services:

  # Keycloak DB (PostgreSQL)
  #soporta mysql pero la documentación recomienda postgres por cuestiones de compatibilidad
  keycloak_db:
    image: postgres:16
    container_name: soa_keycloak_db
    environment:
      POSTGRES_DB: ${KEYCLOAK_DB_NAME}
      POSTGRES_USER: ${KEYCLOAK_DB_USER}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - keycloak_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KEYCLOAK_DB_USER} -d ${KEYCLOAK_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Keycloak (OpenID Provider)
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: soa_keycloak
    ports:
      - "8081:8080"
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak_db:5432/${KEYCLOAK_DB_NAME}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_HTTP_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: temp-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: temp-admin
      KC_HOSTNAME_URL: http://keycloak:8080
      KC_HOSTNAME_STRICT: "false"
    command: start-dev
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 && exec 3<&- 3>&-"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 20s
    depends_on:
      keycloak_db:
        condition: service_healthy

  # Keycloak setup (crea admin permanente, realm soa, client, roles)
  keycloak_setup:
    image: quay.io/keycloak/keycloak:26.0
    container_name: soa_keycloak_setup
    depends_on:
      keycloak:
        condition: service_healthy
    environment:
      KEYCLOAK_ADMIN_USER: ${KEYCLOAK_ADMIN_USER:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    entrypoint: ["/bin/bash", "/opt/setup/keycloak-setup.sh"]
    volumes:
      - ./keycloak-setup.sh:/opt/setup/keycloak-setup.sh
      - ./.env:/host-env/.env

  db:
    image: mysql:8.0
    container_name: soa_mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

#Redis + celery asincronismo entre la recepción de la imagen (API) y su procesamiento(YOLO), cosa de q el usuario no tenga q esperar
#redis (Broker): lista de tareas.
#celery (Worker): proceso en segundo plano que se dedica EXCLUSIVAMENTE a ejecutar YOLO.
#la API recibe la foto, la guarda en SeaweedFS, anota en MySQL que el fotograma está "En Proceso", y deja un "ticket" en Redis. 
#le responde al usuario "Imagen recibida, tu ID es X". Por atras, Celery toma ese ticket de Redis, ejecuta YOLO  y actualiza la base de datos con los resultados finales.
  redis:
    image: redis:alpine
    container_name: soa_redis
    ports:
      - "6379:6379"

  # SeaweedFS Master (Gestiona los volúmenes y metadata)
  seaweed_master:
    image: chrislusf/seaweedfs
    container_name: soa_seaweed_master
    ports:
      - "9333:9333"
      - "19333:19333"
    command: "master -ip=seaweed_master"

  # SeaweedFS Volume (Donde realmente se guardan los archivos)
  seaweed_volume:
    image: chrislusf/seaweedfs
    command: "volume -mserver=seaweed_master:9333 -port=8080 -ip.bind=0.0.0.0"
    ports:
      - "8080"
    depends_on:
      - seaweed_master
    volumes:
      - /data

  api:
    image: twbenjaminvargas/soa-api:1.2
    container_name: soa_fastapi
    ports:
      - "8000:8000"
    environment:
      - SEAWEED_MASTER=http://seaweed_master:9333
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_HOST=db 
      - CELERY_BROKER_URL=redis://redis:6379/0
      - KEYCLOAK_SERVER_URL=http://keycloak:8080
      - KEYCLOAK_REALM=${KEYCLOAK_REALM}
      - KEYCLOAK_CLIENT_ID=${KEYCLOAK_CLIENT_ID}
      - KEYCLOAK_CLIENT_SECRET=${KEYCLOAK_CLIENT_SECRET}
      - FACE_AUTH_SECRET=${FACE_AUTH_SECRET}
      - FACE_AUTH_TOKEN_EXPIRATION=${FACE_AUTH_TOKEN_EXPIRATION}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      seaweed_master:
        condition: service_started
      seaweed_volume:
        condition: service_started
    volumes:
      - ./weights:/app/weights

  # Worker Celery separado: concentra YOLO/OpenCV y sus dependencias nativas
  # Esto evita inflar la imagen HTTP con librerías pesadas que solo sirven para inferencia
  worker:
    image: twbenjaminvargas/soa-worker:1.1
    environment:
      - SEAWEED_MASTER=http://seaweed_master:9333
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_HOST=db
      - CELERY_BROKER_URL=redis://redis:6379/0
      - AZURE_FACE_ENDPOINT=${AZURE_FACE_ENDPOINT}
      - AZURE_FACE_KEY=${AZURE_FACE_KEY}
       # Enviar confirmación (ACK) SOLO cuando la función finalice con éxito
      - CELERY_TASK_ACKS_LATE=True
      # Procesar estrictamente de a 1 tarea a la vez (evita inflar RAM con YOLO)
      - CELERY_WORKER_PREFETCH_MULTIPLIER=1
      # Si el contenedor muere a mitad de ejecución, rechazar la tarea para que vuelva a Redis
      - CELERY_TASK_REJECT_ON_WORKER_LOST=True
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      seaweed_master:
        condition: service_started
      seaweed_volume:
        condition: service_started
    volumes:
      - ./weights:/app/weights

volumes:
  mysql_data:
  seaweed_data:
  keycloak_db_data: