events { worker_connections 1024; }

http {
    # Definimos el DNS interno de Docker para que Nginx pueda consultarlo en caliente
    resolver 127.0.0.11 valid=5s;

    server {
        listen 80;

        # Guardar la URL en una variable obliga a Nginx a resolver el DNS dinámicamente
        set $backend_servers "http://api:8000";

        #Permitir subida de imágenes pesadas (visto en routes_s2.py)
        client_max_body_size 100M;

        location / {
            proxy_pass $backend_servers;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}