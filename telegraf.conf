[agent]
  interval = "10s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  flush_interval = "10s"
  flush_jitter = "0s"
  precision = ""
  hostname = ""
  omit_hostname = false

# --- INPUTS ---

# Escuchar las métricas UDP que envía la API y el Worker
[[inputs.statsd]]
  protocol = "udp"
  service_address = ":8125"
  delete_gauges = true
  delete_counters = true
  delete_sets = true
  delete_timings = true
  percentiles = [50.0, 90.0, 99.0]
  metric_separator = "_"

# Leer las métricas de uso de hardware de tus contenedores
[[inputs.docker]]
 endpoint = "unix:///var/run/docker.sock"
 timeout = "5s"

# --- OUTPUTS ---

# Enviar todo el acumulado ordenado a InfluxDB
[[outputs.influxdb]]
  urls = ["http://influxdb:8086"]
  database = "metrics_db"